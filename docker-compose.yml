services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: antartalk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - antartalk_postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - antartalk_redis:/data
volumes:
  antartalk_postgres:
  antartalk_redis:

